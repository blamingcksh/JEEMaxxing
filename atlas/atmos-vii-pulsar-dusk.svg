<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
<defs>
<radialGradient id="pulsar-void" cx="50%" cy="45%" r="65%">
<stop offset="0%" stop-color="#170E29" />
<stop offset="55%" stop-color="#0B0716" />
<stop offset="100%" stop-color="#040308" />
</radialGradient>
<radialGradient id="pulsar-nebula-glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#67E8F9" stop-opacity="0.7" />
<stop offset="35%" stop-color="#06B6D4" stop-opacity="0.35" />
<stop offset="70%" stop-color="#EC4899" stop-opacity="0.22" />
<stop offset="100%" stop-color="#040308" stop-opacity="0" />
</radialGradient>
<linearGradient id="pulsar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
<stop offset="35%" stop-color="#38BDF8" stop-opacity="0.55" />
<stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
</linearGradient>
</defs>
<!-- Deep Space Canvas &amp; Gold Frame -->
<rect width="600" height="600" fill="url(#pulsar-void)" />
<!-- Outer Celestial Right Ascension / Declination Compass -->
<g transform="translate(300, 255)" fill="none">
<circle cx="0" cy="0" r="212" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.7" />
<circle cx="0" cy="0" r="204" stroke="#D4AF37" stroke-width="5" stroke-dasharray="1.2 5.2" stroke-opacity="0.65" />
<circle cx="0" cy="0" r="190" fill="url(#pulsar-nebula-glow)" />
<line x1="-235" y1="0" x2="235" y2="0" stroke="#06B6D4" stroke-width="0.5" stroke-dasharray="4 4" stroke-opacity="0.5" />
<line x1="0" y1="-225" x2="0" y2="225" stroke="#06B6D4" stroke-width="0.5" stroke-dasharray="4 4" stroke-opacity="0.5" />
</g>
<!-- Supernova Remnant Shock Filaments (H-Alpha Magenta &amp; O-III Cyan) -->
<g transform="translate(300, 255)" fill="none">
<!-- Outer Filamentary Web -->
<path d="M -165 -65 C -195 -10, -145 95, -95 145 C -35 190, 85 185, 145 125 C 195 65, 185 -55, 125 -135 C 55 -195, -115 -155, -165 -65 Z" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="14 6 4 6" stroke-opacity="0.8" />
<path d="M -145 85 C -185 15, -125 -125, -45 -162 C 45 -190, 155 -125, 168 -25 C 180 75, 95 165, -15 168 C -95 170, -125 125, -145 85 Z" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="20 8" stroke-opacity="0.75" />
<!-- Pulsar Magnetosphere &amp; Synchrotron Torus (Tilted -32 deg) -->
<g transform="rotate(-32)">
<!-- Closed Dipole Magnetic Field Loops (Light Cylinder Boundary) -->
<g stroke="#38BDF8" stroke-width="1" stroke-opacity="0.75">
<path d="M 0 0 C 65 -55, 65 55, 0 0 Z" />
<path d="M 0 0 C 115 -95, 115 95, 0 0 Z" stroke-dasharray="3 2" />
<path d="M 0 0 C 168 -135, 168 135, 0 0 Z" stroke="#EC4899" stroke-width="1.1" />
<path d="M 0 0 C -65 -55, -65 55, 0 0 Z" />
<path d="M 0 0 C -115 -95, -115 95, 0 0 Z" stroke-dasharray="3 2" />
<path d="M 0 0 C -168 -135, -168 135, 0 0 Z" stroke="#EC4899" stroke-width="1.1" />
</g>
<!-- Equatorial X-Ray Synchrotron Torus Rings -->
<ellipse cx="0" cy="0" rx="145" ry="38" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.9" />
<ellipse cx="0" cy="0" rx="125" ry="30" fill="#F59E0B" fill-opacity="0.12" stroke="#FFFBEB" stroke-width="1.2" stroke-dasharray="8 4" />
<ellipse cx="0" cy="0" rx="85" ry="20" stroke="#67E8F9" stroke-width="1.6" />
<!-- Relativistic Lighthouse Gamma/Radio Beams &amp; Polar Jets -->
<polygon points="0,0 -32,-198 32,-198" fill="url(#pulsar-beam)" />
<polygon points="0,0 -32,198 32,198" fill="url(#pulsar-beam)" />
<line x1="0" y1="-210" x2="0" y2="210" stroke="#FFFBEB" stroke-width="1.5" stroke-dasharray="8 4" />
<!-- Helical Polar Jet Shock Knots -->
<ellipse cx="0" cy="-95" rx="14" ry="5" fill="#67E8F9" stroke="#FFFBEB" stroke-width="1" />
<ellipse cx="0" cy="-145" rx="22" ry="7" fill="none" stroke="#EC4899" stroke-width="1.4" />
<ellipse cx="0" cy="95" rx="14" ry="5" fill="#67E8F9" stroke="#FFFBEB" stroke-width="1" />
<ellipse cx="0" cy="145" rx="22" ry="7" fill="none" stroke="#EC4899" stroke-width="1.4" />
<!-- Central Neutron Star Core -->
<circle cx="0" cy="0" r="16" fill="#06B6D4" fill-opacity="0.4" stroke="#67E8F9" stroke-width="1.5" />
<circle cx="0" cy="0" r="7" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
</g>
</g>
<!-- Bottom Radio Pulse Profile &amp; Dispersion Measure Oscilloscope -->
<g transform="translate(52, 482)">
<rect x="0" y="0" width="496" height="62" fill="#0B091B" stroke="#D4AF37" stroke-width="1.2" />
<line x1="12" y1="46" x2="484" y2="46" stroke="#6488EA" stroke-width="0.6" stroke-dasharray="2 2" />
<!-- Millisecond Pulsar Periodicity Trace (P = 89.33 ms) -->
<path d="M 12 46 L 65 46 L 74 42 L 82 8 L 90 46 L 145 46 L 152 32 L 158 46 L 230 46 L 239 42 L 247 8 L 255 46 L 310 46 L 317 32 L 323 46 L 395 46 L 404 42 L 412 8 L 420 46 L 484 46" fill="none" stroke="#67E8F9" stroke-width="1.8" />
<!-- Interpulse Envelope -->
<path d="M 74 46 L 82 8 L 90 46 M 239 46 L 247 8 L 255 46 M 404 46 L 412 8 L 420 46" fill="#EC4899" fill-opacity="0.35" />
<circle cx="82" cy="8" r="3" fill="#F59E0B" />
<circle cx="247" cy="8" r="3" fill="#F59E0B" />
<circle cx="412" cy="8" r="3" fill="#F59E0B" />
</g>
<!-- Telemetry Labels -->
<g font-family="monospace" font-size="10" fill="#E0F2FE" letter-spacing="1.5">
</g>
</svg>