<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 36 528 528" width="100%" height="100%">
  <defs>
    <pattern id="dots-2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="rgba(229,192,123,0.34)" fill-opacity="0.3" />
    </pattern>
  </defs>
  <!-- Background & Outer Frame -->
  <circle cx="300" cy="300" r="255" fill="none" stroke="#F2EDE3" stroke-width="0.8" />
  <circle cx="300" cy="300" r="248" fill="none" stroke="#F2EDE3" stroke-width="3" stroke-dasharray="1 5" />
  <!-- Left Specimen Magnification Loupe Overlay -->
  <g transform="translate(145, 220)">
    <circle cx="0" cy="0" r="78" fill="#121724" stroke="#F2EDE3" stroke-width="1.5" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#E07A52" stroke-width="0.8" stroke-dasharray="3 3" />
    <!-- Geometric Diatom / Cellular Structure -->
    <g stroke="#F2EDE3" stroke-width="0.8" fill="none">
      <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#090C14" />
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" stroke="#E07A52" stroke-width="1.2" />
      <circle cx="0" cy="0" r="18" fill="#E07A52" fill-opacity="0.25" stroke="#F2EDE3" stroke-width="1.2" />
      <circle cx="0" cy="0" r="6" fill="#F2EDE3" />
      <line x1="-72" y1="0" x2="72" y2="0" stroke-dasharray="2 3" />
      <line x1="0" y1="-72" x2="0" y2="72" stroke-dasharray="2 3" />
      <line x1="-50" y1="-29" x2="50" y2="29" />
      <line x1="-50" y1="29" x2="50" y2="-29" />
    </g>
    <!-- Callout Line to Stage -->
    <polyline points="78,0 120,0 175,138" fill="none" stroke="#E07A52" stroke-width="1.2" stroke-dasharray="4 3" />
    <circle cx="78" cy="0" r="3" fill="#E07A52" />
  </g>
  <!-- Central Optical Axis -->
  <line x1="320" y1="50" x2="320" y2="545" stroke="#E07A52" stroke-width="1" stroke-dasharray="6 4" />
  <!-- Microscope Body Tube & Internal Optics -->
  <g transform="translate(320, 0)">
    <!-- Ocular Eyepiece -->
    <rect x="-24" y="75" width="48" height="10" fill="#090C14" stroke="rgba(242,237,227,0.45)" stroke-width="0.9" />
    <rect x="-18" y="85" width="36" height="28" fill="#E5C07B" stroke="#F2EDE3" stroke-width="1.5" />
    <!-- Drawtube -->
    <rect x="-22" y="113" width="44" height="45" fill="#121724" stroke="#F2EDE3" stroke-width="1.5" />
    <!-- Main Optical Barrel (Cutaway View) -->
    <rect x="-32" y="158" width="64" height="120" fill="#090C14" stroke="#F2EDE3" stroke-width="1.8" />
    <rect x="-26" y="164" width="52" height="108" fill="none" stroke="#F2EDE3" stroke-width="0.6" />
    <!-- Internal Lenses & Ray Tracing -->
    <ellipse cx="0" cy="90" rx="15" ry="4" fill="#E07A52" fill-opacity="0.4" stroke="#F2EDE3" stroke-width="1" />
    <ellipse cx="0" cy="175" rx="24" ry="6" fill="#E5C07B" fill-opacity="0.4" stroke="#F2EDE3" stroke-width="1" />
    <ellipse cx="0" cy="255" rx="22" ry="6" fill="#E07A52" fill-opacity="0.4" stroke="#F2EDE3" stroke-width="1" />
    <g stroke="#E07A52" stroke-width="0.9" fill="none">
      <polyline points="0,358 -12,320 -22,255 20,175 -12,90 0,60" />
      <polyline points="0,358 12,320 22,255 -20,175 12,90 0,60" />
    </g>
    <!-- Revolving Turret & Objective Lenses -->
    <path d="M -38 278 Q 0 296 38 278 L 32 292 Q 0 306 -32 292 Z" fill="#05070C" />
    <!-- Primary Active Objective -->
    <polygon points="-14,295 14,295 9,338 -9,338" fill="#E5C07B" stroke="#F2EDE3" stroke-width="1.5" />
    <rect x="-6" y="338" width="12" height="8" fill="#F2EDE3" />
    <!-- Angled Secondary Objectives -->
    <g transform="translate(-24, 290) rotate(28)">
      <polygon points="-10,0 10,0 7,30 -7,30" fill="#121724" stroke="#F2EDE3" stroke-width="1.2" />
    </g>
    <g transform="translate(24, 290) rotate(-28)">
      <polygon points="-10,0 10,0 7,30 -7,30" fill="#121724" stroke="#F2EDE3" stroke-width="1.2" />
    </g>
    <!-- Curved Structural Arm & Focus Gears -->
    <path d="M 32 195 C 125 195, 145 385, 45 415 L 45 485 L 15 485 L 15 390 C 90 375, 85 235, 32 235 Z" fill="#05070C" />
    <path d="M 42 205 C 115 205, 130 375, 45 405" fill="none" stroke="#E5C07B" stroke-width="1.2" stroke-dasharray="3 3" />
    <!-- Coarse & Fine Adjustment Knobs -->
    <circle cx="68" cy="245" r="24" fill="#121724" stroke="#F2EDE3" stroke-width="1.8" />
    <circle cx="68" cy="245" r="19" fill="none" stroke="#F2EDE3" stroke-width="2.5" stroke-dasharray="2 3" />
    <circle cx="68" cy="245" r="8" fill="#E07A52" stroke="#F2EDE3" stroke-width="1.2" />
    <circle cx="88" cy="305" r="16" fill="#E5C07B" stroke="#F2EDE3" stroke-width="1.5" />
    <circle cx="88" cy="305" r="11" fill="none" stroke="#F2EDE3" stroke-width="1.5" stroke-dasharray="1.5 2.5" />
    <circle cx="88" cy="305" r="4" fill="#F2EDE3" />
    <!-- Mechanical Stage & Slide -->
    <rect x="-78" y="352" width="135" height="6" fill="#E5C07B" stroke="#F2EDE3" stroke-width="1.2" />
    <rect x="-92" y="358" width="165" height="12" fill="#090C14" stroke="rgba(242,237,227,0.45)" stroke-width="0.9" />
    <circle cx="0" cy="350" r="4" fill="#E07A52" />
    <!-- Substage Condenser & Iris Diaphragm -->
    <polygon points="-26,370 26,370 18,398 -18,398" fill="#121724" stroke="#F2EDE3" stroke-width="1.5" />
    <line x1="-22" y1="384" x2="36" y2="384" stroke="#E07A52" stroke-width="2" />
    <circle cx="36" cy="384" r="4" fill="#E07A52" stroke="#F2EDE3" stroke-width="1" />
    <!-- Illuminator Mirror & Light Source Rays -->
    <g transform="translate(0, 445)">
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#F2EDE3" stroke-width="1.5" />
      <g transform="rotate(-25)">
        <rect x="-34" y="-5" width="68" height="10" rx="3" fill="#090C14" stroke="#F2EDE3" stroke-width="1.5" />
        <line x1="-30" y1="0" x2="30" y2="0" stroke="#E5C07B" stroke-width="2" />
      </g>
      <circle cx="0" cy="0" r="6" fill="#E5C07B" stroke="#F2EDE3" stroke-width="1.2" />
    </g>
    <!-- Incoming Light Cone -->
    <g stroke="#E07A52" stroke-width="0.9" stroke-dasharray="3 3">
      <line x1="-110" y1="395" x2="-15" y2="452" />
      <line x1="-110" y1="415" x2="0" y2="445" />
      <line x1="-110" y1="435" x2="15" y2="438" />
      <line x1="-12" y1="448" x2="-8" y2="398" />
      <line x1="12" y1="440" x2="8" y2="398" />
    </g>
    <!-- Heavy Horseshoe Base -->
    <path d="M -85 485 L 85 485 L 98 515 L -98 515 Z" fill="#121724" stroke="#F2EDE3" stroke-width="1.8" />
    <rect x="-106" y="515" width="212" height="14" rx="3" fill="#090C14" stroke="rgba(242,237,227,0.45)" stroke-width="0.9" />
  </g>
  <!-- Vertical Micrometer Scale (Right) -->
  <g transform="translate(495, 140)" stroke="#F2EDE3" fill="#0B0E17" font-family="monospace" font-size="9">
    <line x1="0" y1="0" x2="0" y2="300" stroke-width="1" />
    <line x1="-8" y1="0" x2="8" y2="0" stroke-width="1.2" />
    <line x1="-5" y1="50" x2="5" y2="50" />
    <line x1="-8" y1="100" x2="8" y2="100" stroke-width="1.2" />
    <line x1="-5" y1="150" x2="5" y2="150" />
    <line x1="-8" y1="200" x2="8" y2="200" stroke-width="1.2" />
    <line x1="-5" y1="250" x2="5" y2="250" />
    <line x1="-8" y1="300" x2="8" y2="300" stroke-width="1.2" />
  </g>
  <!-- Labels -->
</svg>