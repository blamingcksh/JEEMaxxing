<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 36 528 528" width="100%" height="100%">
  <defs>
    <radialGradient id="bh-void" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A102B" />
      <stop offset="55%" stop-color="#0C0816" />
      <stop offset="100%" stop-color="#05030A" />
    </radialGradient>
    <radialGradient id="bh-photon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="36%" stop-color="#000000" stop-opacity="1" />
      <stop offset="44%" stop-color="#FF512F" stop-opacity="0.85" />
      <stop offset="52%" stop-color="#F59E0B" stop-opacity="0.65" />
      <stop offset="68%" stop-color="#9333EA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05030A" stop-opacity="0" />
    </radialGradient>
    <!-- Relativistic Doppler Beaming Gradient (Blue-shift left, Red-shift right) -->
    <linearGradient id="bh-doppler-disk" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="18%" stop-color="#E0F2FE" />
      <stop offset="42%" stop-color="#FBBF24" />
      <stop offset="72%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="bh-jet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#A855F7" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Deep Cosmos Void &amp; Gold Frame -->
  <!-- Lower Lorentzian Spacetime Gravity Well Mesh -->
  <g fill="none">
    <ellipse cx="300" cy="360" rx="245" ry="52" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.4" />
    <ellipse cx="300" cy="398" rx="182" ry="38" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5" />
    <ellipse cx="300" cy="438" rx="118" ry="24" stroke="#A855F7" stroke-width="0.9" stroke-opacity="0.65" />
    <ellipse cx="300" cy="478" rx="70" ry="14" stroke="#F43F5E" stroke-width="1.1" stroke-opacity="0.8" />
    <ellipse cx="300" cy="518" rx="40" ry="8" stroke="#FBBF24" stroke-width="1.3" />
    <ellipse cx="300" cy="548" rx="22" ry="4.5" fill="#FBBF24" fill-opacity="0.3" stroke="#FFFBEB" stroke-width="1.4" />
    <!-- Spacetime Curvature Meridians -->
    <g stroke="url(#bh-doppler-disk)" stroke-width="0.75" stroke-opacity="0.55">
      <path d="M 55 360 C 165 385, 245 445, 278 548" />
      <path d="M 122 326 C 200 365, 260 440, 285 548" />
      <path d="M 195 312 C 245 355, 275 440, 292 548" />
      <path d="M 545 360 C 435 385, 355 445, 322 548" />
      <path d="M 478 326 C 400 365, 340 440, 315 548" />
      <path d="M 405 312 C 355 355, 325 440, 308 548" />
    </g>
  </g>
  <!-- Outer Astrometric Vernier Ring -->
  <g transform="translate(300, 240)" fill="none">
    <circle cx="0" cy="0" r="198" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="188" stroke="#38BDF8" stroke-width="4" stroke-dasharray="1 5" stroke-opacity="0.55" />
    <circle cx="0" cy="0" r="165" fill="url(#bh-photon-glow)" />
  </g>
  <!-- Relativistic Kerr Singularity &amp; Warped Accretion Disk (Tilted -16 deg) -->
  <g transform="translate(300, 240) rotate(-16)">
    <!-- Astrophysical Polar Jets &amp; Helical Magnetic Flux -->
    <polygon points="-28,-205 0,-60 28,-205" fill="url(#bh-jet)" />
    <polygon points="-24,195 0,60 24,195" fill="url(#bh-jet)" />
    <line x1="0" y1="-215" x2="0" y2="215" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 3" />
    <path d="M -8 -75 C -34 -105, 34 -130, -16 -160 C -36 -180, 26 -190, 0 -208" fill="none" stroke="#E0F2FE" stroke-width="1.1" />
    <path d="M 8 75 C 34 105, -34 130, 16 160 C 36 180, -26 190, 0 208" fill="none" stroke="#E0F2FE" stroke-width="1.1" />
    <!-- Gravitationally Lensed Upper &amp; Lower Photon Halo Arcs -->
    <path d="M -142 0 A 142 132 0 0 1 142 0" fill="none" stroke="url(#bh-doppler-disk)" stroke-width="6" stroke-opacity="0.45" />
    <path d="M -134 0 A 134 122 0 0 1 134 0" fill="none" stroke="url(#bh-doppler-disk)" stroke-width="2.2" />
    <path d="M -118 0 A 118 105 0 0 1 118 0" fill="none" stroke="#FFFBEB" stroke-width="1.2" stroke-dasharray="8 4" />
    <path d="M -128 0 A 128 114 0 0 0 128 0" fill="none" stroke="url(#bh-doppler-disk)" stroke-width="3.5" stroke-opacity="0.6" />
    <path d="M -112 0 A 112 98 0 0 0 112 0" fill="none" stroke="#FBBF24" stroke-width="1.1" stroke-dasharray="4 3" />
    <!-- Innermost Stable Circular Orbit (ISCO) &amp; Event Horizon Shadow -->
    <circle cx="0" cy="0" r="78" fill="#040208" stroke="#FBBF24" stroke-width="2.2" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="12 6" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#F43F5E" stroke-width="1.4" />
    <circle cx="0" cy="0" r="56" fill="none" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="2 4" />
    <!-- Equatorial Relativistic Accretion Disk -->
    <path d="M -232 0 A 232 48 0 0 0 232 0 A 232 30 0 0 1 -232 0 Z" fill="url(#bh-doppler-disk)" fill-opacity="0.85" stroke="#FFFBEB" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="232" ry="40" fill="none" stroke="url(#bh-doppler-disk)" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="200" ry="33" fill="none" stroke="#FFFBEB" stroke-width="1.4" stroke-dasharray="12 5" />
    <ellipse cx="0" cy="0" rx="168" ry="26" fill="none" stroke="#38BDF8" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="138" ry="19" fill="none" stroke="#FBBF24" stroke-width="1.5" />
    <!-- Approaching Blue-Shifted Plasma Hotspots (Left) vs Receding Red-Shifted (Right) -->
    <circle cx="-168" cy="9" r="6" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-138" cy="-7" r="4.5" fill="#38BDF8" />
    <circle cx="168" cy="-9" r="5" fill="#EF4444" stroke="#7E22CE" stroke-width="1.2" />
    <circle cx="142" cy="8" r="3.5" fill="#F59E0B" />
    <!-- Central Singularity Crosshair -->
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.7" />
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.7" />
    <circle cx="0" cy="0" r="4" fill="none" stroke="#F43F5E" stroke-width="1.2" />
  </g>
  <!-- Doppler Shift Spectral Bar (Top Right) -->
  <!-- Telemetry Labels -->
</svg>