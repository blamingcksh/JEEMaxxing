<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 36 528 528" width="100%" height="100%">
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E07A52" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E07A52" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background & Architectural Border -->
  <circle cx="300" cy="260" r="210" fill="url(#core-glow)" />
  <!-- Cardinal Axis Lines -->
  <g stroke="#F2EDE3" stroke-width="0.6" stroke-dasharray="4 4">
    <line x1="40" y1="260" x2="560" y2="260" />
    <line x1="300" y1="35" x2="300" y2="555" />
    <line x1="140" y1="100" x2="460" y2="420" stroke-opacity="0.4" />
    <line x1="140" y1="420" x2="460" y2="100" stroke-opacity="0.4" />
  </g>
  <!-- Armillary Sphere Assembly -->
  <g transform="translate(300, 260)">
    <!-- Outer Meridian Graduated Ring -->
    <circle cx="0" cy="0" r="192" fill="none" stroke="#F2EDE3" stroke-width="1.8" />
    <circle cx="0" cy="0" r="184" fill="none" stroke="#F2EDE3" stroke-width="6" stroke-dasharray="1.5 6.5" />
    <circle cx="0" cy="0" r="176" fill="none" stroke="#F2EDE3" stroke-width="1.2" />
    <!-- Inner Celestial Rings (Tilted Polar Axis -23.5 deg) -->
    <g transform="rotate(-23.5)">
      <!-- Polar Axis Rod & Finials -->
      <line x1="0" y1="-208" x2="0" y2="208" stroke="#E07A52" stroke-width="1.8" />
      <polygon points="0,-218 -6,-202 6,-202" fill="#E07A52" />
      <circle cx="0" cy="208" r="4" fill="#E07A52" />
      <!-- Colure Ellipses -->
      <ellipse cx="0" cy="0" rx="168" ry="65" fill="none" stroke="#F2EDE3" stroke-width="1.2" />
      <ellipse cx="0" cy="0" rx="65" ry="168" fill="none" stroke="#F2EDE3" stroke-width="1.2" />
      <ellipse cx="0" cy="0" rx="130" ry="168" fill="none" stroke="#F2EDE3" stroke-width="0.7" stroke-dasharray="3 3" />
      <!-- Tropics & Polar Circles -->
      <ellipse cx="0" cy="-65" rx="154" ry="26" fill="none" stroke="#E5C07B" stroke-width="1.2" />
      <ellipse cx="0" cy="65" rx="154" ry="26" fill="none" stroke="#E5C07B" stroke-width="1.2" />
      <ellipse cx="0" cy="-138" rx="95" ry="16" fill="none" stroke="#F2EDE3" stroke-width="0.8" stroke-dasharray="2 3" />
      <ellipse cx="0" cy="138" rx="95" ry="16" fill="none" stroke="#F2EDE3" stroke-width="0.8" stroke-dasharray="2 3" />
      <!-- Celestial Equator Band -->
      <ellipse cx="0" cy="0" rx="168" ry="38" fill="none" stroke="#F2EDE3" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="168" ry="32" fill="none" stroke="#F2EDE3" stroke-width="4" stroke-dasharray="2 6" />
    </g>
    <!-- Zodiacal Ecliptic Band (Rotated +23.5 deg relative to Equator) -->
    <g transform="rotate(14)">
      <ellipse cx="0" cy="0" rx="172" ry="44" fill="#E5C07B" fill-opacity="0.18" stroke="#F2EDE3" stroke-width="1.8" />
      <ellipse cx="0" cy="0" rx="172" ry="35" fill="none" stroke="#E07A52" stroke-width="1.2" stroke-dasharray="8 4" />
      <!-- Orbital Nodes -->
      <circle cx="-142" cy="-24" r="6" fill="#090C14" stroke="#F2EDE3" stroke-width="1.5" />
      <circle cx="115" cy="32" r="5" fill="#E07A52" stroke="#F2EDE3" stroke-width="1.2" />
      <circle cx="45" cy="-42" r="4" fill="#F2EDE3" />
    </g>
    <!-- Horizontal Horizon Ring -->
    <ellipse cx="0" cy="0" rx="198" ry="24" fill="#121724" fill-opacity="0.6" stroke="#F2EDE3" stroke-width="1.8" />
    <line x1="-198" y1="0" x2="198" y2="0" stroke="#F2EDE3" stroke-width="1" />
    <!-- Central Tellurion (Earth & Moon Orbit) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#E07A52" stroke-width="0.9" stroke-dasharray="2 3" />
    <circle cx="33" cy="-32" r="6" fill="#121724" stroke="#F2EDE3" stroke-width="1.2" />
    <circle cx="0" cy="0" r="22" fill="#05070C" />
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="none" stroke="#E5C07B" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="8" ry="22" fill="none" stroke="#E5C07B" stroke-width="1" />
    <circle cx="0" cy="0" r="4" fill="#E07A52" />
  </g>
  <!-- Cradle & Compass Pedestal -->
  <g stroke="#F2EDE3" fill="none">
    <!-- Semicircular Support Cradle -->
    <path d="M 102 260 A 198 198 0 0 0 498 260" stroke-width="3.5" />
    <path d="M 96 260 A 204 204 0 0 0 504 260" stroke-width="1" />
    <rect x="90" y="254" width="16" height="12" fill="#E5C07B" stroke-width="1.2" />
    <rect x="494" y="254" width="16" height="12" fill="#E5C07B" stroke-width="1.2" />
    <!-- Turned Pedestal Column -->
    <polygon points="282,458 318,458 310,485 290,485" fill="#E5C07B" stroke-width="1.5" />
    <ellipse cx="300" cy="495" rx="24" ry="8" fill="#05070C" />
    <polygon points="286,502 314,502 332,535 268,535" fill="#121724" stroke-width="1.5" />
    <!-- Base Compass Rose -->
    <ellipse cx="300" cy="542" rx="95" ry="16" fill="#090C14" stroke-width="1.8" />
    <ellipse cx="300" cy="542" rx="75" ry="11" stroke="#E07A52" stroke-width="1" stroke-dasharray="3 3" />
    <polygon points="300,526 308,542 300,558 292,542" fill="#E07A52" stroke-width="1" />
  </g>
  <!-- Labels -->
</svg>