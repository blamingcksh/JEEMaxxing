<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <pattern id="lunar-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E1D1A" stroke-width="0.35" stroke-opacity="0.18" />
    </pattern>
    <pattern id="umbra-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1E1D1A" stroke-width="1.2" stroke-opacity="0.75" />
    </pattern>
    <clipPath id="lunar-disk">
      <circle cx="300" cy="270" r="185" />
    </clipPath>
  </defs>

  <!-- Background & Outer Frame -->
  <rect width="600" height="600" fill="#F4EFE6" />
  <rect x="24" y="24" width="552" height="552" fill="url(#lunar-grid)" stroke="#1E1D1A" stroke-width="1.5" />
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#1E1D1A" stroke-width="0.6" />

  <!-- Outer Selenographic Coordinate Rings -->
  <g transform="translate(300, 270)" fill="none" stroke="#1E1D1A">
    <circle cx="0" cy="0" r="218" stroke-width="1" />
    <circle cx="0" cy="0" r="210" stroke-width="5" stroke-dasharray="1.2 5.3" />
    <circle cx="0" cy="0" r="198" stroke="#C59B5F" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Cardinal Axis Extensions -->
    <line x1="-245" y1="0" x2="245" y2="0" stroke-width="0.7" stroke-dasharray="3 3" />
    <line x1="0" y1="-235" x2="0" y2="235" stroke-width="0.7" stroke-dasharray="3 3" />
  </g>

  <!-- Clipped Lunar Sphere & Orthographic Graticule -->
  <g clip-path="url(#lunar-disk)">
    <circle cx="300" cy="270" r="185" fill="#E6DEC8" />

    <!-- Lunar Maria (Basaltic Plains) -->
    <path d="M 190 160 Q 250 130 310 175 T 370 245 Q 340 300 265 275 T 190 160 Z" fill="#C59B5F" fill-opacity="0.28" stroke="#1E1D1A" stroke-width="0.8" stroke-dasharray="3 2" />
    <path d="M 335 190 Q 395 180 420 235 T 375 310 Q 335 280 335 190 Z" fill="#C59B5F" fill-opacity="0.22" stroke="#1E1D1A" stroke-width="0.8" stroke-dasharray="3 2" />
    <circle cx="215" cy="245" r="42" fill="#C59B5F" fill-opacity="0.25" stroke="#1E1D1A" stroke-width="0.8" />

    <!-- Spherical Latitude & Longitude Grid -->
    <g transform="translate(300, 270)" fill="none" stroke="#1E1D1A" stroke-width="0.5" stroke-opacity="0.45">
      <ellipse cx="0" cy="0" rx="60" ry="185" />
      <ellipse cx="0" cy="0" rx="120" ry="185" />
      <ellipse cx="0" cy="0" rx="165" ry="185" />
      <ellipse cx="0" cy="-60" rx="175" ry="22" />
      <ellipse cx="0" cy="60" rx="175" ry="22" />
      <ellipse cx="0" cy="-120" rx="140" ry="18" />
      <ellipse cx="0" cy="120" rx="140" ry="18" />
    </g>

    <!-- Major Ray Crater (Tycho) & Ejecta Trajectories -->
    <g transform="translate(275, 375)" fill="none">
      <g stroke="#D96B43" stroke-width="0.8" stroke-dasharray="6 4">
        <line x1="0" y1="0" x2="-160" y2="-190" />
        <line x1="0" y1="0" x2="-85" y2="-240" />
        <line x1="0" y1="0" x2="45" y2="-220" />
        <line x1="0" y1="0" x2="155" y2="-145" />
        <line x1="0" y1="0" x2="180" y2="-35" />
        <line x1="0" y1="0" x2="-145" y2="-45" />
        <line x1="0" y1="0" x2="65" y2="95" />
      </g>
      <circle cx="0" cy="0" r="24" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.5" />
      <circle cx="0" cy="0" r="17" stroke="#D96B43" stroke-width="1.2" />
      <circle cx="0" cy="0" r="4" fill="#D96B43" />
    </g>

    <!-- Copernicus & Secondary Craters -->
    <g transform="translate(235, 225)">
      <circle cx="0" cy="0" r="19" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.4" />
      <circle cx="0" cy="0" r="13" fill="none" stroke="#1E1D1A" stroke-width="0.8" stroke-dasharray="2 2" />
      <circle cx="0" cy="0" r="3" fill="#1E1D1A" />
    </g>
    <g transform="translate(348, 285)">
      <circle cx="0" cy="0" r="15" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.2" />
      <circle cx="0" cy="0" r="2.5" fill="#D96B43" />
    </g>
    <g transform="translate(315, 145)">
      <circle cx="0" cy="0" r="22" fill="#E6DEC8" stroke="#1E1D1A" stroke-width="1.4" />
      <path d="M -22 0 A 22 22 0 0 1 22 0" fill="#1E1D1A" fill-opacity="0.3" />
    </g>

    <!-- Lunar Terminator Shadow Zone -->
    <path d="M 300 85 A 95 185 0 0 0 300 455 A 185 185 0 0 1 300 85 Z" fill="url(#umbra-hatch)" />
    <path d="M 300 85 A 65 185 0 0 0 300 455 A 185 185 0 0 1 300 85 Z" fill="#1E1D1A" fill-opacity="0.88" />
    <path d="M 300 85 A 95 185 0 0 0 300 455" fill="none" stroke="#D96B43" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- Lunar Limb Outline -->
  <circle cx="300" cy="270" r="185" fill="none" stroke="#1E1D1A" stroke-width="2" />

  <!-- High-Magnification Crater Rim Callout (Top Right) -->
  <g transform="translate(485, 115)">
    <circle cx="0" cy="0" r="54" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#D96B43" stroke-width="0.8" stroke-dasharray="2 3" />
    <circle cx="0" cy="0" r="28" fill="#E6DEC8" stroke="#1E1D1A" stroke-width="1.5" />
    <path d="M -28 0 A 28 28 0 0 1 0 -28 L 0 28 A 28 28 0 0 1 -28 0 Z" fill="#1E1D1A" fill-opacity="0.8" />
    <circle cx="0" cy="0" r="6" fill="#D96B43" />
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#1E1D1A" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#1E1D1A" stroke-width="0.6" stroke-dasharray="2 2" />
    <polyline points="-38,38 -80,80 -210,260" fill="none" stroke="#D96B43" stroke-width="1.1" stroke-dasharray="3 3" />
  </g>

  <!-- Bottom Hypsometric Crater Elevation Cross-Section -->
  <g transform="translate(60, 505)" fill="none" stroke="#1E1D1A">
    <rect x="0" y="0" width="480" height="42" fill="#F4EFE6" stroke-width="1.2" />
    <line x1="0" y1="28" x2="480" y2="28" stroke="#C59B5F" stroke-width="0.8" stroke-dasharray="3 3" />
    <path d="M 10 28 L 85 28 L 115 12 L 135 36 L 195 36 L 210 20 L 225 36 L 285 36 L 305 12 L 335 28 L 470 28" stroke="#1E1D1A" stroke-width="1.6" />
    <path d="M 115 12 L 135 36 L 195 36 L 210 20 L 225 36 L 285 36 L 305 12" stroke="#D96B43" stroke-width="1.2" fill="#D96B43" fill-opacity="0.15" />
  </g>

  <!-- Technical Annotations -->
  <g font-family="monospace" font-size="10" fill="#1E1D1A" letter-spacing="1.5">
    <text x="44" y="52">OBS. 01 // SELENOGRAPHIC TOPOGRAPHY</text>
    <text x="44" y="68" fill="#D96B43">TYCHO EXPANSE • 43.31°S 11.36°W</text>
    <text x="68" y="498">ALTIMETRY PROFILE (DEPTH: -4.8 KM)</text>
  </g>
</svg>