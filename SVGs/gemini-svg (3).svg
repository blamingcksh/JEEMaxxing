<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <pattern id="fine-lines-4" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1E1D1A" stroke-width="0.6" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background & Frame -->
  <rect width="600" height="600" fill="#F4EFE6" />
  <rect x="24" y="24" width="552" height="552" fill="none" stroke="#1E1D1A" stroke-width="1.5" />

  <!-- Solar Radiation Rays (Top Left Corner to Center) -->
  <g stroke="#C59B5F" stroke-width="0.7" stroke-dasharray="3 5">
    <line x1="24" y1="300" x2="576" y2="300" />
    <line x1="300" y1="24" x2="300" y2="576" />
    <line x1="105" y1="105" x2="495" y2="495" />
    <line x1="105" y1="495" x2="495" y2="105" />
  </g>

  <!-- Umbra & Penumbra Eclipse Cone -->
  <polygon points="300,256 576,220 576,380 300,344" fill="url(#fine-lines-4)" />
  <polygon points="300,256 550,300 300,344" fill="#1E1D1A" fill-opacity="0.12" stroke="#D96B43" stroke-width="0.9" stroke-dasharray="4 3" />

  <!-- Concentric Vernier & Synodic Rings -->
  <g transform="translate(300, 300)" fill="none" stroke="#1E1D1A">
    <!-- Outer Degree Ring -->
    <circle cx="0" cy="0" r="245" stroke-width="1.5" />
    <circle cx="0" cy="0" r="236" stroke-width="6" stroke-dasharray="1.2 5.22" />
    <circle cx="0" cy="0" r="228" stroke-width="0.8" />

    <!-- Lunar Orbit Track -->
    <circle cx="0" cy="0" r="190" stroke="#D96B43" stroke-width="1.5" />
    <circle cx="0" cy="0" r="182" stroke-width="0.6" stroke-dasharray="4 4" />

    <!-- Mechanical Orrery Gear Rings -->
    <circle cx="0" cy="0" r="132" stroke-width="1.2" />
    <circle cx="0" cy="0" r="126" stroke-width="4" stroke-dasharray="3 5" />
    <circle cx="0" cy="0" r="95" stroke="#C59B5F" stroke-width="1.5" />
    <circle cx="0" cy="0" r="88" stroke-width="0.8" stroke-dasharray="2 3" />

    <!-- Mechanical Sweeping Arms -->
    <g stroke="#1E1D1A" stroke-width="1.5">
      <line x1="-132" y1="0" x2="132" y2="0" />
      <line x1="0" y1="-132" x2="0" y2="132" />
      <line x1="0" y1="0" x2="134" y2="-134" stroke="#D96B43" stroke-width="2" />
      <circle cx="95" cy="-95" r="7" fill="#C59B5F" stroke="#1E1D1A" stroke-width="1.2" />
    </g>

    <!-- Central Tellurian Globe & Gear -->
    <circle cx="0" cy="0" r="44" fill="#E6DEC8" stroke-width="1.8" />
    <path d="M 0 -44 A 44 44 0 0 1 0 44 Z" fill="#1E1D1A" />
    <circle cx="0" cy="0" r="28" fill="#F4EFE6" stroke="#C59B5F" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#D96B43" stroke="#1E1D1A" stroke-width="1.2" />
    <circle cx="0" cy="0" r="4" fill="#F4EFE6" />

    <!-- 8 Lunar Phase Stations at R = 190 -->
    <!-- 1. New Moon (Left, -190, 0) -->
    <g transform="translate(-190, 0)">
      <circle cx="0" cy="0" r="28" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="0.8" stroke-dasharray="2 2" />
      <circle cx="0" cy="0" r="22" fill="#1E1D1A" stroke="#1E1D1A" stroke-width="1.5" />
    </g>

    <!-- 2. Waxing Crescent (-134, -134) -->
    <g transform="translate(-134, -134)">
      <circle cx="0" cy="0" r="28" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="0.8" />
      <circle cx="0" cy="0" r="22" fill="#1E1D1A" stroke="#1E1D1A" stroke-width="1.5" />
      <path d="M 0 -22 A 22 22 0 0 0 0 22 A 12 22 0 0 1 0 -22 Z" fill="#F4EFE6" />
    </g>

    <!-- 3. First Quarter (0, -190) -->
    <g transform="translate(0, -190)">
      <circle cx="0" cy="0" r="28" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="0.8" />
      <circle cx="0" cy="0" r="22" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.5" />
      <path d="M 0 -22 A 22 22 0 0 1 0 22 Z" fill="#1E1D1A" />
    </g>

    <!-- 4. Waxing Gibbous (134, -134) -->
    <g transform="translate(134, -134)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#D96B43" stroke-width="1.2" />
      <circle cx="0" cy="0" r="22" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.5" />
      <path d="M 0 -22 A 22 22 0 0 1 0 22 A 12 22 0 0 0 0 -22 Z" fill="#1E1D1A" />
    </g>

    <!-- 5. Full Moon / Eclipse (190, 0) -->
    <g transform="translate(190, 0)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#D96B43" stroke-width="1" stroke-dasharray="2 2" />
      <circle cx="0" cy="0" r="22" fill="#D96B43" fill-opacity="0.35" stroke="#1E1D1A" stroke-width="1.5" />
      <circle cx="-6" cy="-5" r="5" fill="none" stroke="#1E1D1A" stroke-width="0.7" />
      <circle cx="7" cy="6" r="7" fill="none" stroke="#1E1D1A" stroke-width="0.7" />
    </g>

    <!-- 6. Waning Gibbous (134, 134) -->
    <g transform="translate(134, 134)">
      <circle cx="0" cy="0" r="28" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="0.8" />
      <circle cx="0" cy="0" r="22" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.5" />
      <path d="M 0 -22 A 22 22 0 0 0 0 22 A 12 22 0 0 1 0 -22 Z" fill="#1E1D1A" />
    </g>

    <!-- 7. Third Quarter (0, 190) -->
    <g transform="translate(0, 190)">
      <circle cx="0" cy="0" r="28" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="0.8" />
      <circle cx="0" cy="0" r="22" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.5" />
      <path d="M 0 -22 A 22 22 0 0 0 0 22 Z" fill="#1E1D1A" />
    </g>

    <!-- 8. Waning Crescent (-134, 134) -->
    <g transform="translate(-134, 134)">
      <circle cx="0" cy="0" r="28" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="0.8" />
      <circle cx="0" cy="0" r="22" fill="#1E1D1A" stroke="#1E1D1A" stroke-width="1.5" />
      <path d="M 0 -22 A 22 22 0 0 1 0 22 A 12 22 0 0 0 0 -22 Z" fill="#F4EFE6" />
    </g>
  </g>

  <!-- Corner Ephemeris Data -->
  <g font-family="monospace" font-size="10" fill="#1E1D1A" letter-spacing="1.5">
    <text x="44" y="52">FIG. 04 // SYNODIC SELENOGRAPH</text>
    <text x="44" y="68" fill="#D96B43">PERIOD: 29d 12h 44m 03s</text>
    <text x="44" y="542">SOLAR VECTOR ←</text>
    <text x="420" y="542">UMBRA TRANSIT</text>
  </g>
</svg>