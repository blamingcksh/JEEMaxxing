<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="morpho-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#101B2B" />
      <stop offset="65%" stop-color="#0A101A" />
      <stop offset="100%" stop-color="#05080E" />
    </radialGradient>
    <linearGradient id="morpho-wing-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#0072FF" />
      <stop offset="75%" stop-color="#4A00E0" />
      <stop offset="100%" stop-color="#8E2DE2" />
    </linearGradient>
    <linearGradient id="morpho-scale-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70E1F5" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#1A2980" />
    </linearGradient>
    <linearGradient id="morpho-scale-violet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F857A6" />
      <stop offset="50%" stop-color="#8E2DE2" />
      <stop offset="100%" stop-color="#3A1C71" />
    </linearGradient>
    <clipPath id="morpho-loupe-clip">
      <circle cx="425" cy="225" r="104" />
    </clipPath>
  </defs>

  <!-- Deep Indigo Background & Gold Frame -->
  <rect width="600" height="600" fill="url(#morpho-bg)" />
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.85" />
  <rect x="28" y="28" width="544" height="544" fill="none" stroke="#00F2FE" stroke-width="0.5" stroke-opacity="0.35" />

  <!-- Geometric Golden-Ratio & Goniometric Sighting Circles -->
  <g stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.4" fill="none">
    <circle cx="215" cy="260" r="195" stroke-dasharray="4 4" />
    <circle cx="215" cy="260" r="135" />
    <line x1="42" y1="260" x2="558" y2="260" stroke-dasharray="3 3" />
    <line x1="215" y1="42" x2="215" y2="465" stroke-dasharray="3 3" />
  </g>

  <!-- Macro Morpho Rhetenor Forewing & Hindwing Specimen -->
  <g transform="translate(65, 85)">
    <!-- Forewing Outer Dark Margin & Iridescent Blade -->
    <path d="M 35 195 C 45 85, 165 10, 265 15 C 285 75, 255 165, 195 205 Z" fill="#0B0F19" stroke="#D4AF37" stroke-width="1.8" />
    <path d="M 42 190 C 52 95, 155 25, 245 28 C 260 78, 235 155, 185 198 Z" fill="url(#morpho-wing-grad)" stroke="#00F2FE" stroke-width="1.2" />

    <!-- Hindwing -->
    <path d="M 35 195 C 95 195, 195 205, 225 275 C 195 345, 105 375, 55 325 C 35 285, 35 235, 35 195 Z" fill="#0B0F19" stroke="#D4AF37" stroke-width="1.8" />
    <path d="M 42 200 C 95 200, 182 210, 208 270 C 182 330, 105 355, 62 312 Z" fill="url(#morpho-wing-grad)" stroke="#00F2FE" stroke-width="1.2" />

    <!-- Chitinous Wing Venation & Discal Cell -->
    <g fill="none" stroke="#FFFDF7" stroke-width="1.3" stroke-opacity="0.85">
      <path d="M 42 190 Q 125 115 245 28" />
      <path d="M 42 190 Q 135 140 165 135" />
      <path d="M 165 135 L 250 75" />
      <path d="M 165 135 L 240 125" />
      <path d="M 165 135 L 215 165" />
      <path d="M 125 155 L 185 198" />
      <!-- Hindwing Veins -->
      <path d="M 42 200 Q 125 235 208 270" />
      <path d="M 115 230 L 185 310" />
      <path d="M 115 230 L 140 338" />
      <path d="M 115 230 L 92 335" />
    </g>

    <!-- Marginal Ocelli Spots -->
    <g fill="#FFFDF7" fill-opacity="0.85">
      <circle cx="255" cy="48" r="3" />
      <circle cx="258" cy="88" r="3.5" />
      <circle cx="246" cy="130" r="3" />
      <circle cx="222" cy="168" r="2.5" />
      <circle cx="212" cy="292" r="3" />
      <circle cx="185" cy="328" r="3" />
      <circle cx="142" cy="348" r="2.5" />
    </g>

    <!-- Target Sampling Reticle on Forewing -->
    <circle cx="165" cy="115" r="15" fill="#F857A6" fill-opacity="0.3" stroke="#F857A6" stroke-width="1.6" />
    <circle cx="165" cy="115" r="3.5" fill="#00F2FE" />
    <line x1="180" y1="115" x2="255" y2="125" stroke="#F857A6" stroke-width="1.3" stroke-dasharray="3 2" />
  </g>

  <!-- High-Magnification Photonic Scale Lattice Loupe (1,000X) -->
  <g>
    <circle cx="425" cy="225" r="112" fill="#080D16" stroke="#D4AF37" stroke-width="1.6" />
    <circle cx="425" cy="225" r="104" fill="#0D1726" stroke="#00F2FE" stroke-width="2" />

    <g clip-path="url(#morpho-loupe-clip)">
      <!-- Imbricated Shingle-Like Wing Scales with Apical Denticles -->
      <!-- Row 1 (Top) -->
      <g transform="translate(320, 105)" stroke="#FFFDF7" stroke-width="0.9">
        <polygon points="0,0 48,0 48,65 36,55 24,68 12,55 0,65" fill="url(#morpho-scale-cyan)" />
        <polygon points="54,0 102,0 102,65 90,55 78,68 66,55 54,65" fill="url(#morpho-scale-violet)" />
        <polygon points="108,0 156,0 156,65 144,55 132,68 120,55 108,65" fill="url(#morpho-scale-cyan)" />
        <polygon points="162,0 210,0 210,65 198,55 186,68 174,55 162,65" fill="url(#morpho-scale-violet)" />
      </g>
      <!-- Row 2 (Mid - Offset) -->
      <g transform="translate(295, 165)" stroke="#FFFDF7" stroke-width="1">
        <polygon points="0,0 48,0 48,70 36,58 24,72 12,58 0,70" fill="url(#morpho-scale-violet)" />
        <polygon points="54,0 102,0 102,70 90,58 78,72 66,58 54,70" fill="url(#morpho-scale-cyan)" />
        <polygon points="108,0 156,0 156,70 144,58 132,72 120,58 108,70" fill="url(#morpho-scale-cyan)" stroke="#D4AF37" stroke-width="1.6" />
        <polygon points="162,0 210,0 210,70 198,58 186,72 174,58 162,70" fill="url(#morpho-scale-violet)" />
        <polygon points="216,0 264,0 264,70 252,58 240,72 228,58 216,70" fill="url(#morpho-scale-cyan)" />
      </g>
      <!-- Row 3 (Bottom) -->
      <g transform="translate(320, 230)" stroke="#FFFDF7" stroke-width="0.9">
        <polygon points="0,0 48,0 48,70 36,58 24,72 12,58 0,70" fill="url(#morpho-scale-cyan)" />
        <polygon points="54,0 102,0 102,70 90,58 78,72 66,58 54,70" fill="url(#morpho-scale-violet)" />
        <polygon points="108,0 156,0 156,70 144,58 132,72 120,58 108,70" fill="url(#morpho-scale-cyan)" />
        <polygon points="162,0 210,0 210,70 198,58 186,72 174,58 162,70" fill="url(#morpho-scale-violet)" />
      </g>

      <!-- Nano-Ridge Striations on Highlighted Central Scale -->
      <g stroke="#00F2FE" stroke-width="0.6" stroke-opacity="0.8">
        <line x1="412" y1="165" x2="412" y2="232" />
        <line x1="420" y1="165" x2="420" y2="232" />
        <line x1="428" y1="165" x2="428" y2="232" />
        <line x1="436" y1="165" x2="436" y2="232" />
        <line x1="444" y1="165" x2="444" y2="232" />
      </g>

      <!-- Loupe Crosshair -->
      <line x1="321" y1="225" x2="529" y2="225" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="4 3" />
      <line x1="425" y1="121" x2="425" y2="329" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="4 3" />
    </g>

    <circle cx="425" cy="225" r="98" fill="none" stroke="#D4AF37" stroke-width="4" stroke-dasharray="1 5.1" />
  </g>

  <!-- Bottom Nano-Ridge Lamellae Cross-Section & Thin-Film Interference Diagram -->
  <g transform="translate(52, 438)">
    <rect x="0" y="0" width="496" height="106" fill="#0B1320" stroke="#D4AF37" stroke-width="1.2" />
    <!-- Base Chitin Cuticle -->
    <rect x="20" y="86" width="456" height="8" fill="#D4AF37" fill-opacity="0.6" stroke="#D4AF37" stroke-width="1" />

    <!-- 4 Photonic "Christmas-Tree" Nano-Ridge Pillars (Spacing d = 200nm) -->
    <g stroke="#00F2FE" stroke-width="1.8" stroke-linecap="round">
      <!-- Pillar 1 -->
      <g transform="translate(95, 0)">
        <line x1="0" y1="22" x2="0" y2="86" stroke="#D4AF37" stroke-width="2.5" />
        <line x1="-18" y1="30" x2="18" y2="30" /><line x1="-22" y1="42" x2="22" y2="42" />
        <line x1="-26" y1="54" x2="26" y2="54" /><line x1="-30" y1="66" x2="30" y2="66" />
        <line x1="-34" y1="78" x2="34" y2="78" />
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(185, 0)">
        <line x1="0" y1="22" x2="0" y2="86" stroke="#D4AF37" stroke-width="2.5" />
        <line x1="-18" y1="30" x2="18" y2="30" /><line x1="-22" y1="42" x2="22" y2="42" />
        <line x1="-26" y1="54" x2="26" y2="54" /><line x1="-30" y1="66" x2="30" y2="66" />
        <line x1="-34" y1="78" x2="34" y2="78" />
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(275, 0)">
        <line x1="0" y1="22" x2="0" y2="86" stroke="#D4AF37" stroke-width="2.5" />
        <line x1="-18" y1="30" x2="18" y2="30" /><line x1="-22" y1="42" x2="22" y2="42" />
        <line x1="-26" y1="54" x2="26" y2="54" /><line x1="-30" y1="66" x2="30" y2="66" />
        <line x1="-34" y1="78" x2="34" y2="78" />
      </g>
    </g>

    <!-- Incident White Light & Constructive Blue (450nm) Interference Rays -->
    <g fill="none" stroke-width="1.3">
      <polyline points="325,8 275,30 335,8" stroke="#00F2FE" />
      <polyline points="338,8 275,54 358,8" stroke="#F857A6" stroke-dasharray="3 2" />
      <!-- Sinusoidal 450nm Reflected Wave -->
      <path d="M 355 52 Q 368 28, 381 52 T 407 52 T 433 52 T 459 52 T 482 52" stroke="#00F2FE" stroke-width="2" />
      <path d="M 355 52 Q 368 76, 381 52 T 407 52 T 433 52 T 459 52 T 482 52" stroke="#8E2DE2" stroke-width="1.2" stroke-dasharray="2 2" />
    </g>
  </g>

  <!-- Telemetry Labels -->
  <g font-family="monospace" font-size="10" fill="#E0F2FE" letter-spacing="1.5">
    <text x="42" y="48" fill="#D4AF37">PLATE IV // LEPIDOPTERA PHOTONIC GYROID SCALES</text>
    <text x="42" y="64" fill="#00F2FE">BRAGG CONSTRUCTIVE INTERFERENCE • 2d·sin(θ) = mλ (450nm)</text>
    <text x="52" y="428" fill="#F857A6">CHITIN NANO-RIDGE LAMELLAE CROSS-SECTION (n = 1.56)</text>
  </g>
</svg>