<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <pattern id="sand-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1E1D1A" fill-opacity="0.45" />
      <circle cx="5" cy="4" r="0.6" fill="#D96B43" fill-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background & Outer Frame -->
  <rect width="600" height="600" fill="#F4EFE6" />
  <rect x="24" y="24" width="552" height="552" fill="none" stroke="#1E1D1A" stroke-width="1.5" />
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#1E1D1A" stroke-width="0.6" />

  <!-- Chladni Resonance Plate (360 x 360 Centered at 300, 270) -->
  <g transform="translate(300, 270)">
    <!-- Outer Acoustic Plate & Corner Clamps -->
    <rect x="-185" y="-185" width="370" height="370" fill="#E6DEC8" fill-opacity="0.45" stroke="#1E1D1A" stroke-width="2" />
    <rect x="-175" y="-175" width="350" height="350" fill="none" stroke="#1E1D1A" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Nodal Sand Accumulation Lobes -->
    <path d="M -175 -175 Q 0 -30 175 -175 Q 30 0 175 175 Q 0 30 -175 175 Q -30 0 -175 -175 Z" fill="url(#sand-stipple)" stroke="#1E1D1A" stroke-width="1.5" />

    <!-- Primary & Secondary Chladni Nodal Contours (m=3, n=5) -->
    <g fill="none">
      <!-- Diagonal & Orthogonal Nodal Axes -->
      <line x1="-185" y1="0" x2="185" y2="0" stroke="#1E1D1A" stroke-width="0.8" stroke-dasharray="4 4" />
      <line x1="0" y1="-185" x2="0" y2="185" stroke="#1E1D1A" stroke-width="0.8" stroke-dasharray="4 4" />
      <line x1="-185" y1="-185" x2="185" y2="185" stroke="#C59B5F" stroke-width="0.8" />
      <line x1="-185" y1="185" x2="185" y2="-185" stroke="#C59B5F" stroke-width="0.8" />

      <!-- Hyperbolic Nodal Curves -->
      <path d="M -110 -185 C -55 -65, 55 -65, 110 -185" stroke="#1E1D1A" stroke-width="1.8" />
      <path d="M -110 185 C -55 65, 55 65, 110 185" stroke="#1E1D1A" stroke-width="1.8" />
      <path d="M -185 -110 C -65 -55, -65 55, -185 110" stroke="#1E1D1A" stroke-width="1.8" />
      <path d="M 185 -110 C 65 -55, 65 55, 185 110" stroke="#1E1D1A" stroke-width="1.8" />

      <!-- Harmonic 4-Fold & 8-Fold Rosette Interference -->
      <path d="M 0 -155 C 55 -155, 55 155, 0 155 C -55 155, -55 -155, 0 -155 Z" stroke="#D96B43" stroke-width="1.5" />
      <path d="M -155 0 C -155 55, 155 55, 155 0 C 155 -55, -155 -55, -155 0 Z" stroke="#D96B43" stroke-width="1.5" />
      <g transform="rotate(45)">
        <path d="M 0 -155 C 55 -155, 55 155, 0 155 C -55 155, -55 -155, 0 -155 Z" stroke="#C59B5F" stroke-width="1.3" />
        <path d="M -155 0 C -155 55, 155 55, 155 0 C 155 -55, -155 -55, -155 0 Z" stroke="#C59B5F" stroke-width="1.3" />
      </g>

      <!-- Concentric Acoustic Wavefronts -->
      <circle cx="0" cy="0" r="145" stroke="#1E1D1A" stroke-width="1.2" />
      <circle cx="0" cy="0" r="95" stroke="#1E1D1A" stroke-width="1.5" stroke-dasharray="6 3" />
      <circle cx="0" cy="0" r="48" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.8" />
    </g>

    <!-- Antinode Vibration Maxima & Central Driver Mount -->
    <g fill="#D96B43" stroke="#1E1D1A" stroke-width="1">
      <circle cx="0" cy="-120" r="4.5" />
      <circle cx="0" cy="120" r="4.5" />
      <circle cx="-120" cy="0" r="4.5" />
      <circle cx="120" cy="0" r="4.5" />
      <circle cx="-95" cy="-95" r="4" fill="#C59B5F" />
      <circle cx="95" cy="-95" r="4" fill="#C59B5F" />
      <circle cx="-95" cy="95" r="4" fill="#C59B5F" />
      <circle cx="95" cy="95" r="4" fill="#C59B5F" />
      <!-- Center Transducer Bolt -->
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#1E1D1A" />
      <circle cx="0" cy="0" r="5" fill="#D96B43" />
    </g>
  </g>

  <!-- Bottom Standing Wave Envelope & Harmonic Nodes -->
  <g transform="translate(65, 488)" fill="none">
    <rect x="0" y="0" width="470" height="54" fill="#F4EFE6" stroke="#1E1D1A" stroke-width="1.2" />
    <line x1="15" y1="27" x2="455" y2="27" stroke="#1E1D1A" stroke-width="0.7" stroke-dasharray="3 3" />
    <!-- Fundamental & 4th Harmonic Envelope -->
    <path d="M 15 27 Q 70 -12, 125 27 T 235 27 T 345 27 T 455 27" stroke="#1E1D1A" stroke-width="1.6" />
    <path d="M 15 27 Q 70 66, 125 27 T 235 27 T 345 27 T 455 27" stroke="#D96B43" stroke-width="1.4" stroke-dasharray="4 3" />
    <!-- Nodal Points -->
    <g fill="#D96B43" stroke="#1E1D1A" stroke-width="1">
      <circle cx="15" cy="27" r="3.5" />
      <circle cx="125" cy="27" r="3.5" />
      <circle cx="235" cy="27" r="3.5" />
      <circle cx="345" cy="27" r="3.5" />
      <circle cx="455" cy="27" r="3.5" />
    </g>
  </g>

  <!-- Technical Annotations -->
  <g font-family="monospace" font-size="10" fill="#1E1D1A" letter-spacing="1.5">
    <text x="44" y="52">OBS. 07 // CYMATIC CHLADNI RESONANCE</text>
    <text x="44" y="68" fill="#D96B43">EIGENMODE (m=3, n=5) • f = 1,428 Hz</text>
    <text x="65" y="480">STANDING WAVE NODAL DISPLACEMENT</text>
  </g>
</svg>